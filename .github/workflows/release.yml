name: Release

# Corre solo tras un éxito de CI en main, nunca sobre código sin verificar.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  # Exigidos por @semantic-release/github, aunque el comentario automático
  # en issues/PRs está desactivado (successComment: false en .releaserc.json)
  # para no generar ruido en un repo de un único mantenedor — solo se usa
  # para crear la Release.
  issues: write
  pull-requests: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # semantic-release necesita ver todo el historial de tags para
          # calcular el rango de commits desde el último release.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
