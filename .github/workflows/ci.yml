name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      # Solo para este run de CI (efímero, sin datos reales) — nunca se leen
      # de un secreto real del repo porque no protegen nada: apps/storefront
      # y apps/admin exigen igualmente su propio AUTH_SECRET para poder
      # arrancar Auth.js, y apps/api el suyo para firmar/verificar el JWT
      # propio (ver AUTH_JWT_SECRET en jwt.ts). Sin esto, el login real que
      # ejercitan los specs E2E falla con "MissingSecret" en cuanto
      # test:e2e se ejecuta de verdad en CI (nunca se había disparado antes
      # porque test:e2e no corría en CI hasta esta fase).
      AUTH_SECRET: "ci-e2e-test-secret-not-for-production"
      AUTH_JWT_SECRET: "ci-e2e-test-secret-not-for-production"
      API_URL: "http://127.0.0.1:4000"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo lint typecheck test build

      - name: Set up the database for E2E (lightweight seed, no Unsplash/Cloudinary calls)
        working-directory: apps/api
        run: |
          pnpm exec prisma migrate deploy
          pnpm run db:seed:lighthouse

      - name: Install Playwright browsers
        working-directory: apps/storefront
        run: pnpm exec playwright install --with-deps chromium

      # --concurrency=1: apps/storefront y apps/admin gestionan cada una su
      # propia instancia de apps/api vía webServer (playwright.config.ts,
      # puerto 4000 fijo) — en paralelo, la segunda en arrancar encuentra el
      # puerto ya ocupado y falla (reuseExistingServer es false en CI).
      #
      # --env-mode=loose: causa raíz real de varios intentos fallidos de
      # esta misma fase — Turborepo 2.x filtra por defecto (env-mode strict)
      # cualquier variable de entorno no declarada explícitamente en el
      # `env` de la tarea en turbo.json. `test:e2e` no declara ninguna, así
      # que DATABASE_URL/AUTH_SECRET/AUTH_JWT_SECRET/API_URL (definidas más
      # arriba a nivel de job) se descartaban antes de llegar al proceso
      # real de Playwright/Next.js, aunque `build` sí las recibía (declara
      # "env": ["DATABASE_URL"]). Confirmado leyendo el log de un run real:
      # apps/api arrancaba sin DATABASE_URL solo dentro de test:e2e, nunca
      # en el build. loose (no declarar cada variable una a una en
      # turbo.json) es el modo recomendado por Turborepo para E2E/tareas de
      # integración, donde la pureza estricta de caché de build no aplica.
      - run: pnpm turbo test:e2e --concurrency=1 --env-mode=loose
