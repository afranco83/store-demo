packages:
  - "apps/*"
  - "packages/*"
overrides:
  # Fase 8: chromium-bidi (dependencia transitiva de @lhci/cli/puppeteer-core,
  # ver package.json de apps/storefront) trae su propia copia de zod@3.25.x,
  # que sin este override pnpm resolvía de forma ambigua para
  # @hookform/resolvers y rompía el build de TypeScript (zodResolver
  # detectaba dos versiones de zod incompatibles). Todo el repo usa zod 4.
  zod: 4.4.3
allowBuilds:
  "@prisma/engines": true
  # Dependencia opcional transitiva de `prisma` (no de apps/api directamente,
  # que ya migró a @prisma/adapter-libsql/Turso) — no necesita build nativo.
  better-sqlite3: false
  esbuild: true
  msw: true
  prisma: true
  sharp: true
minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.10.4"
  - "@turbo/darwin-arm64@2.10.4"
  - "@turbo/linux-64@2.10.4"
  - "@turbo/linux-arm64@2.10.4"
  - "@turbo/windows-64@2.10.4"
  - "@turbo/windows-arm64@2.10.4"
  - "@typescript-eslint/eslint-plugin@8.63.0"
  - "@typescript-eslint/parser@8.63.0"
  - "@typescript-eslint/project-service@8.63.0"
  - "@typescript-eslint/scope-manager@8.63.0"
  - "@typescript-eslint/tsconfig-utils@8.63.0"
  - "@typescript-eslint/type-utils@8.63.0"
  - "@typescript-eslint/types@8.63.0"
  - "@typescript-eslint/typescript-estree@8.63.0"
  - "@typescript-eslint/utils@8.63.0"
  - "@typescript-eslint/visitor-keys@8.63.0"
  - turbo@2.10.4
  - typescript-eslint@8.63.0
